[workspace]
resolver = "2"
members = ["third_party/tetra3", "crates/unisolver-synth", "crates/unisolver-starmatch", "crates/unisolver-core", "tools/namesgen", "tools/solvecli", "packages/unisolver_flutter/rust", "crates/unisolver-cabi", "tools/xtask"]
exclude = ["internal"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UMa-Technology/unisolver"

# Profiles from upstream tetra3rs's Cargo.toml (stripped when vendoring, since profiles only
# take effect at the workspace root). Never add panic = "abort": FFI callers rely on unwinding.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3

# Apps build the plugin in their debug runs too (cargokit passes --release only to profile and
# release builds), and an unoptimized engine solves 9–13× slower: 18 photos and FITS frames took
# 83 s against 6.6 s. So debug builds optimize the engine and every dependency as well, keeping
# debug assertions and overflow checks. `*` covers dependencies only, so the workspace members
# that make up the shipped libraries are named.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tetra3]
opt-level = 3

[profile.dev.package.unisolver-core]
opt-level = 3

[profile.dev.package.unisolver-starmatch]
opt-level = 3

[profile.dev.package.unisolver_frb]
opt-level = 3

[profile.dev.package.unisolver-cabi]
opt-level = 3
