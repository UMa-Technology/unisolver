language = "C"
include_guard = "UNISOLVER_H"
cpp_compat = true
documentation = true
style = "type"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen from unisolver-cabi. Do not edit; run `cargo build -p unisolver-cabi`. */"
after_includes = """

/*
 * Ownership and lifetimes
 * =======================
 * Every pointer this library returns is allocated by Rust and must be released
 * with the matching unisolver_*_close / unisolver_string_free, never with free()
 * or delete. Every release function accepts NULL as a no-op.
 *
 * Owned by the caller (must be released):
 *   - UnisolverSolver*     unisolver_open             -> unisolver_close
 *   - UnisolverPool*       unisolver_pool_open        -> unisolver_pool_close
 *   - UnisolverAnnotator*  unisolver_*annotator_open  -> unisolver_annotator_close
 *   - UnisolverCalibration* unisolver_calibration_open -> unisolver_calibration_close
 *   - char* (JSON results and *error_out)             -> unisolver_string_free
 * Errors: a function with `char** error_out` sets *error_out = NULL on success;
 * on failure it writes an OWNED message and returns NULL/false.
 * Threads: one UnisolverSolver may run solves concurrently (shared read-only);
 * no call may be in flight when it is closed. Calls that change a pool or a
 * calibration session must not overlap other calls on the same handle.
 */"""

[parse]
parse_deps = false
