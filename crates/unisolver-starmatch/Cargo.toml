[package]
name = "unisolver-starmatch"
description = "Star-pattern matching for unisolver's narrow-field engine: a star-centred blind index, hinted triangle matching, star tiles and TAN WCS. Derived from seiza (Apache-2.0)."
version.workspace = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
publish = false

[dependencies]
memmap2 = "0.9"
rayon = "1"
rustc-hash = "2"
thiserror = "2"

[dev-dependencies]
# Parity with the code this crate was ported from (tests/seiza_parity.rs); removed with it
seiza = { path = "../../third_party/seiza/seiza", default-features = false }
sha2 = "0.10"
