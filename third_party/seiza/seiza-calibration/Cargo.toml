[package]
name = "seiza-calibration"
description = "Host-neutral calibration for linear images: response kernels, frame-set matching, and pedestal fitting"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/theatrus/seiza"
authors = ["Yann Ramin <github@theatr.us>"]
readme = "README.md"
keywords = ["astronomy", "astrophotography", "calibration", "flat-field"]
categories = ["science", "multimedia::images"]

[dependencies]
serde = { version = "1", features = ["derive"] }
seiza-imgproc = { path = "../seiza-imgproc", version = "0.3.2" }
seiza-stats = { path = "../seiza-stats", version = "0.1.0" }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
