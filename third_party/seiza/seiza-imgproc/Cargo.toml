[package]
name = "seiza-imgproc"
description = "Pure-Rust image processing primitives with OpenCV-compatible semantics: blur, Canny, thresholding, morphology, components, contours, filtering, and wavelets"
version = "0.3.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/theatrus/seiza"
authors = ["Yann Ramin <github@theatr.us>"]
readme = "README.md"
keywords = ["image-processing", "canny", "contours", "morphology"]
categories = ["computer-vision", "science"]

[features]
# Opt-in intra-image parallelism via rayon. Bit-identical results: work
# splits along rows/columns whose computations are independent, and every
# per-pixel operation order is unchanged.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
