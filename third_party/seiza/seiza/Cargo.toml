[package]
name = "seiza"
description = "Star detection, WCS fitting, and near-field plate solving for astrophotography"
version = "0.19.2"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/theatrus/seiza"
authors = ["Yann Ramin <github@theatr.us>"]
readme = "README.md"
keywords = ["astronomy", "astrophotography", "plate-solving", "wcs", "astrometry"]
categories = ["science", "multimedia::images"]

[dependencies]
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
seiza-calibration = { path = "../seiza-calibration", version = "0.4.2" }
memmap2 = "0.9"
rayon = "1"
seiza-stats = { path = "../seiza-stats", version = "0.1.0" }
rustc-hash = { version = "2" }
wide = "1.6"
multiversion = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
